# Chatbot - textos padrão da conversa (usados quando o formulário não define os seus)
chatbot.greeting.default=Olá! Vou te fazer algumas perguntas rápidas.
chatbot.farewell.default=Obrigado pelas respostas! Entraremos em contato.
# {0} = rótulo do campo
chatbot.question.default=Qual o seu {0}?

# Chatbot - mensagens do envelope de resposta
chatbot.response.started=Conversa iniciada.
chatbot.response.answered=Resposta registrada.

# Chatbot - erros
chatbot.error.form-not-found=Formulário não encontrado.
chatbot.error.session-not-found=Sessão não encontrada.
chatbot.error.form-not-chatbot=Este formulário não está configurado para o modo chatbot.
chatbot.error.form-inactive=Este formulário não está ativo.
chatbot.error.form-without-fields=Este formulário não possui campos.
chatbot.error.session-closed=Esta conversa já foi encerrada.
chatbot.error.invalid-request=Requisição inválida.

# Chatbot - validação de entrada
chatbot.validation.answer-blank=A resposta não pode ficar em branco.
