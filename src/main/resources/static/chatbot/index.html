<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="chatbot.widget.page-title">Chatbot</title>
<link rel="stylesheet" href="chatbot.css">
</head>
<body>

<section class="chat" id="chat" aria-labelledby="chat-title">
  <!-- Cabeçalho -->
  <header class="chat__header">
    <div class="chat__avatar" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </div>
    <div class="chat__heading">
      <span class="chat__title" id="chat-title" data-i18n="chatbot.widget.title"></span>
      <span class="chat__status" id="chat-status"></span>
    </div>
    <button type="button" class="chat__close" id="chat-close" data-i18n-aria-label="chatbot.widget.close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </header>

  <!-- Mensagens -->
  <div class="chat__body" id="chat-body">
    <div class="chat__log" id="chat-log" role="log" aria-live="polite"></div>
  </div>

  <!-- Campo de digitação -->
  <form class="chat__composer" id="chat-composer">
    <label for="chat-input" class="visually-hidden" data-i18n="chatbot.widget.input-label"></label>
    <input id="chat-input" class="chat__input" type="text" autocomplete="off" data-i18n-placeholder="chatbot.widget.input-placeholder">
    <button type="submit" class="chat__send" id="chat-send" data-i18n-aria-label="chatbot.widget.send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </form>

  <!-- Concluído (ou falha ao iniciar) -->
  <div class="chat__done" id="chat-done" hidden>
    <button type="button" class="chat__restart" id="chat-restart" data-i18n="chatbot.widget.restart"></button>
  </div>

  <!-- Rodapé -->
  <footer class="chat__footer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6Z"/></svg>
    <span data-i18n="chatbot.widget.footer"></span>
  </footer>
</section>

<!-- Botão para reabrir o chat depois de fechado -->
<button type="button" class="launcher" id="chat-open" hidden data-i18n-aria-label="chatbot.widget.open">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
</button>

<script src="i18n/pt-BR.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
