spring.application.name=omnipages

#Config do banco
spring.datasource.url=jdbc:postgresql://localhost:5432/landing_forms_db
spring.datasource.username=omni
spring.datasource.password=omni123

#Config do JPA para o Schema Landing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=landing
spring.jpa.show-sql=true

# Config do Flyway
spring.flyway.enabled=true
spring.flyway.schemas=landing
spring.flyway.default-schema=landing
spring.flyway.locations=classpath:db/migration