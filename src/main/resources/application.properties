spring.application.name=omnipages
server.port=${SERVER_PORT:8088}

#Config do banco
spring.datasource.url=jdbc:postgresql://localhost:5432/plataforma
spring.datasource.username=${DB_APP_USER:usr_landing}
spring.datasource.password=${DB_APP_PASSWORD}

#Config do JPA para o Schema Landing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=landing
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Config do Flyway
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/plataforma}
spring.flyway.user=${DB_OWNER_USER:${DB_APP_USER:urs_landing}}
spring.flyway.password=${DB_OWNER_PASSWORD:${DB_APP_PASSWORD}}
spring.flyway.schemas=landing
spring.flyway.default-schema=landing
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/api/identity/.well-known/jwks.json}
landing.security.issuer=${JWT_ISSUER:http://identity:8081}